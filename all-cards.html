<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>全部卡片 · 知识蒸馏工坊</title><style>
:root{
  --bg:#F6F3EC;--surface:rgba(246,243,236,.82);--surface-solid:#FFFDF7;
  --border:rgba(27,24,19,.10);--fill:rgba(27,24,19,.05);
  --text:#1B1813;--t2:#57514A;--t3:#8E877D;--t4:#A8A096;
  --accent:#B03A20;--seal:#B03A20;--red:#B03A20;--orange:#B0762A;--green:#4A7C59;--purple:#8A6A9E;--teal:#3E6B73;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --r-sm:10px;--r-md:14px;--r-lg:20px;
  --shadow:0 1px 2px rgba(27,24,19,.04),0 8px 24px rgba(27,24,19,.05);
  --shadow-lg:0 8px 32px rgba(27,24,19,.09);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#131210;--surface:rgba(19,18,16,.82);--surface-solid:#1D1B18;
  --border:rgba(239,234,224,.10);--fill:rgba(239,234,224,.055);
  --text:#EFEAE0;--t2:#B3ACA1;--t3:#8A8378;--t4:#6E685F;
  --accent:#D9614A;--seal:#D9614A;--red:#D9614A;--orange:#C99A5B;--green:#7BA88C;--purple:#A890BC;--teal:#7FA8B0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  --shadow-lg:0 8px 32px rgba(0,0,0,.4);
}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
a{color:var(--accent);text-decoration:none}
.container{max-width:900px;margin:0 auto;padding:0 16px}

/* Hero */
.hero{padding:40px 0 24px;text-align:center}
.hero-icon{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#007AFF,#8A6A9E);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;box-shadow:0 8px 24px rgba(0,122,255,.2)}
.hero h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.hero-sub{font-size:15px;color:var(--t3);margin-top:6px;line-height:1.6}
.hero-stats{display:flex;justify-content:center;gap:0;margin-top:20px;background:var(--surface-solid);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.stat{flex:1;text-align:center;padding:14px 8px;border-right:.5px solid var(--border)}
.stat:last-child{border-right:none}
.stat-n{font-size:22px;font-weight:700;color:var(--accent)}
.stat-l{font-size:11px;color:var(--t4);margin-top:2px;font-weight:500}

/* Books */
.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:28px}
.book{background:var(--surface-solid);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;cursor:pointer;transition:all .15s;text-decoration:none;color:var(--text);display:block;border-left:4px solid var(--accent)}
.book:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.book:active{transform:scale(.98)}
.book-title{font-size:16px;font-weight:700;margin-bottom:3px;line-height:1.3}
.book-author{font-size:12px;color:var(--t3);margin-bottom:8px}
.book-count{font-size:11px;font-weight:600;color:var(--accent);background:rgba(0,122,255,.1);padding:2px 10px;border-radius:20px;display:inline-block}
.book:nth-child(1){border-left-color:var(--blue)}
.book:nth-child(2){border-left-color:var(--crimson)}
.book:nth-child(3){border-left-color:var(--violet)}
.book:nth-child(4){border-left-color:var(--emerald)}
.book:nth-child(1) .book-count{background:rgba(0,122,255,.1);color:var(--blue)}
.book:nth-child(2) .book-count{background:rgba(196,30,58,.1);color:var(--crimson)}
.book:nth-child(3) .book-count{background:rgba(176,58,32,.1);color:var(--violet)}
.book:nth-child(4) .book-count{background:rgba(5,150,105,.1);color:var(--emerald)}

/* Search Section */
.search-section{background:var(--surface-solid);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px;margin-bottom:28px}
.search-label{font-size:13px;font-weight:600;color:var(--t3);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.search-row{display:flex;gap:8px;margin-bottom:16px}
.search-input{flex:1;padding:10px 14px;border-radius:var(--r-md);border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--t4)}
.search-btn{padding:10px 20px;border-radius:var(--r-md);border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;white-space:nowrap}
.search-btn:hover{opacity:.85}
.question-row{display:flex;gap:8px}
.question-input{flex:1;padding:10px 14px;border-radius:var(--r-md);border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:border-color .2s;resize:none;min-height:42px;max-height:100px}
.question-input:focus{border-color:var(--orange)}
.question-input::placeholder{color:var(--t4)}
.question-btn{padding:10px 20px;border-radius:var(--r-md);border:none;background:var(--orange);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;white-space:nowrap}
.question-btn:hover{opacity:.85}
.search-hint{font-size:11px;color:var(--t4);margin-top:8px}
.q-btns{display:flex;gap:8px;flex-shrink:0}
.deep-btn{background:#8A6A9E}
.deep-box{margin-top:12px;border:1.5px solid #8A6A9E;border-radius:var(--r-md);overflow:hidden;background:var(--bg)}
.deep-box-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(88,86,214,.1);font-size:13px;font-weight:600;color:#8A6A9E}
.copy-btn{padding:6px 16px;border-radius:var(--r-sm);border:none;background:#8A6A9E;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
.copy-btn:hover{opacity:.85}
.deep-prompt{width:100%;box-sizing:border-box;border:none;outline:none;padding:14px;font-size:13px;line-height:1.7;font-family:inherit;color:var(--text);background:var(--bg);resize:vertical;min-height:220px;max-height:420px}
.deep-tip{font-size:11px;color:var(--t4);padding:10px 14px;background:var(--fill);line-height:1.6}
.result-count{font-size:13px;color:var(--t2);margin-bottom:16px;padding:8px 14px;background:var(--fill);border-radius:var(--r-sm);display:none;font-weight:500}
.result-count.show{display:block}

/* Match Results */
.match-section{margin-bottom:28px;display:none}
.match-section.show{display:block}
.match-header{font-size:17px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.match-count{font-size:13px;color:var(--t4);font-weight:400}
.match-grid{display:grid;grid-template-columns:1fr;gap:10px}

/* Four-Section Solution */
.sol-box{background:var(--surface-solid);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.sol-header{background:linear-gradient(135deg,var(--accent),#8A6A9E);color:#fff;padding:16px 20px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.sol-sec{padding:16px 20px;border-bottom:1px solid var(--border)}
.sol-sec:last-child{border-bottom:none}
.sol-sec h3{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sol-sec h3 .num{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0}
.sol-diag h3 .num{background:var(--blue)}
.sol-methods h3 .num{background:var(--violet)}
.sol-steps h3 .num{background:var(--orange)}
.sol-risks h3 .num{background:var(--red)}
.sol-diag{background:rgba(0,122,255,.04)}
.sol-methods{background:rgba(138,106,158,.04)}
.sol-steps{background:rgba(176,118,42,.04)}
.sol-risks{background:rgba(176,58,32,.04)}
.sol-diag p{font-size:14px;color:var(--t2);line-height:1.7}
.sol-method{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border)}
.sol-method:last-child{border-bottom:none}
.sol-method .m-name{font-size:14px;font-weight:600;color:var(--accent);flex-shrink:0;min-width:110px}
.sol-method .m-desc{font-size:13px;color:var(--t2);line-height:1.6}
.sol-method .m-desc .m-book{color:var(--t4);font-size:12px}
.sol-step{display:flex;gap:10px;padding:8px 0;align-items:flex-start}
.sol-step .s-n{background:var(--orange);color:#fff;font-weight:700;font-size:12px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.sol-step .s-t{font-size:14px;color:var(--t2);line-height:1.6}
.sol-step .s-t .s-src{color:var(--t4);font-size:12px;margin-left:4px}
.sol-risk{display:flex;gap:8px;padding:6px 0;font-size:13px;color:var(--t2);line-height:1.6;align-items:flex-start}
.sol-risk::before{content:"⚠";flex-shrink:0;color:var(--red);font-size:14px}
.sol-fallback-tip{font-size:13px;color:var(--t4);padding:8px 0;line-height:1.6}


/* Topic Nav */
.topic-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:24px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.topic-nav::-webkit-scrollbar{display:none}
.topic-btn{padding:7px 16px;border-radius:20px;border:none;background:var(--fill);color:var(--t3);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s;font-family:inherit}
.topic-btn.active{color:#fff;font-weight:600}
.topic-btn[data-topic="all"].active{background:var(--accent)}
.topic-btn[data-topic="compete"].active{background:var(--blue)}
.topic-btn[data-topic="decision"].active{background:var(--violet)}
.topic-btn[data-topic="system"].active{background:var(--emerald)}
.topic-btn[data-topic="org"].active{background:var(--crimson)}
.topic-btn[data-topic="innovate"].active{background:var(--orange)}

/* Topic Section */
.topic-section{margin-bottom:32px}
.topic-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--border)}
.topic-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.topic-header h2{font-size:18px;font-weight:700;letter-spacing:-.02em}
.topic-header .tc{font-size:12px;color:var(--t4);margin-left:auto;font-weight:500}

/* Cards Grid */
.cards-grid{display:grid;grid-template-columns:1fr;gap:10px}

/* Card Item */
.ci{background:var(--surface-solid);border-radius:var(--r-md);box-shadow:var(--shadow);padding:14px 16px;transition:all .15s;cursor:pointer;text-decoration:none;color:var(--text);display:block;position:relative;overflow:hidden}
.ci:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.ci:active{transform:scale(.99)}
.ci::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 2px 2px 0}
.ci[data-book="sunzi"]::before{background:var(--blue)}
.ci[data-book="mao"]::before{background:var(--crimson)}
.ci[data-book="fp"]::before{background:var(--violet)}
.ci[data-book="gt"]::before{background:var(--emerald)}
.ci-head{display:flex;align-items:center;margin-bottom:4px;padding-left:2px}
.ci-num{font-size:10px;font-weight:700;color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-right:6px;flex-shrink:0}
.ci[data-book="sunzi"] .ci-num{background:var(--blue)}
.ci[data-book="mao"] .ci-num{background:var(--crimson)}
.ci[data-book="fp"] .ci-num{background:var(--violet)}
.ci[data-book="gt"] .ci-num{background:var(--emerald)}
.ci-title{font-size:14px;font-weight:700;line-height:1.3}
.ci-score{font-size:10px;font-weight:700;color:#fff;background:var(--orange);padding:2px 6px;border-radius:4px;margin-left:6px;flex-shrink:0}
.ci-book{font-size:11px;color:var(--t4);margin-bottom:4px;padding-left:30px}
.ci-concept{font-size:13px;color:var(--t2);line-height:1.5;margin-bottom:6px;padding-left:30px}
.ci-tags{display:flex;gap:4px;flex-wrap:wrap;padding-left:30px}
.tag{font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px}
.tag-b{background:rgba(0,122,255,.1);color:var(--accent)}
.ci[data-book="mao"] .tag-b{background:rgba(196,30,58,.1);color:var(--crimson)}
.ci[data-book="fp"] .tag-b{background:rgba(176,58,32,.1);color:var(--violet)}
.ci[data-book="gt"] .tag-b{background:rgba(5,150,105,.1);color:var(--emerald)}
.ci.hidden{display:none}

/* Footer */
.footer{text-align:center;padding:28px 0;color:var(--t4);font-size:12px}

/* Responsive */
@media(min-width:600px){
  .cards-grid,.match-grid{grid-template-columns:1fr 1fr}
}
@media(min-width:700px){
  .hero h1{font-size:34px}
  .books{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:500px){
  .hero h1{font-size:24px}
  .search-row,.question-row{flex-direction:column}
  .search-btn,.question-btn{width:100%}
  .q-btns{width:100%}
  .q-btns .question-btn{flex:1}
  .hero-stats{flex-wrap:wrap}
  .stat{min-width:25%}
}

/* v2 门户导航 */
.group{margin:28px 0 10px}
.group-h{display:flex;align-items:baseline;gap:8px;font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--text)}
.group-c{font-size:12px;color:var(--t4);font-weight:500}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.nav-cards{display:flex;gap:10px;margin:20px 0 4px}
.nav-card{flex:1;background:var(--surface-solid);border-radius:var(--r-md);box-shadow:var(--shadow);padding:14px 16px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:3px}
.nav-card b{font-size:15px;letter-spacing:-.01em}
.nav-card span{font-size:12px;color:var(--t3);line-height:1.4}
.hint-note{font-size:11px;color:var(--t4);margin:22px 2px 0;line-height:1.6}
@media(max-width:500px){.nav-cards{flex-direction:column}}
/* v2-fold-injected 书内页折叠 */
details{display:block}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary.st::after{content:"\25B8";margin-left:6px;font-size:10px;color:var(--t4);transition:transform .15s;display:inline-block}
details[open]>summary.st::after{transform:rotate(90deg)}
details[open]>summary.st{color:var(--accent)}

/* ============ 墨纸朱印 · 阅读舒适层 ============ */
body{
  background-color:var(--bg);line-height:1.75;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background-image:radial-gradient(circle at 14% 4%,rgba(176,58,32,.05),transparent 40%),
    repeating-linear-gradient(0deg,transparent 0 33px,rgba(27,24,19,.02) 33px 34px);
  background-attachment:fixed;
}
.hero h1{font-family:var(--serif);letter-spacing:.05em}
.hero-sub{letter-spacing:.02em}
.ov{background:var(--surface-solid);border:1px solid var(--border)}
.ov h2{font-family:var(--serif);letter-spacing:.04em}
.ov p{line-height:1.9;font-size:15px}
.src-note{line-height:1.85;background:var(--fill)}
.card{box-shadow:var(--shadow);border:1px solid var(--border)}
.ct{font-family:var(--serif);letter-spacing:.02em;line-height:1.4}
.cs{line-height:1.6}
.cnum{background:var(--seal);font-family:var(--serif)}
.tag{letter-spacing:.02em}
.ts{background:rgba(176,58,32,.08);color:var(--seal)}
.tt{background:rgba(138,106,158,.10);color:var(--purple)}
.cb{padding:0 20px 26px}
.s{margin-bottom:26px}
.st{letter-spacing:.14em;color:var(--t3);border-bottom-color:var(--border)}
.s p{line-height:1.9;font-size:15.5px}
.s strong{font-weight:600}
.ot{background:var(--fill);border-left-color:var(--seal);padding:15px 17px}
.ot-q{line-height:1.85;font-size:15.5px}
.ot-i{line-height:1.85;font-size:14.5px}
.deep{background:rgba(176,58,32,.035);border-color:rgba(176,58,32,.14);padding:19px}
.deep h4{font-family:var(--serif);letter-spacing:.02em}
.deep p{line-height:1.9;font-size:14.5px}
.insight{line-height:1.9;padding:12px 16px;font-size:14.5px}
.cases{background:rgba(62,107,115,.05);border-color:rgba(62,107,115,.15)}
.cases h4{font-family:var(--serif);color:var(--teal)}
.cd,.cn{line-height:1.85}
.flow{background:rgba(176,118,42,.06);border-color:rgba(176,118,42,.16)}
.flow h4{font-family:var(--serif)}
.fst,.ft2{line-height:1.9;font-size:14.5px}
.fsg,.ftr{line-height:1.8}
.fbox{background:var(--fill)}
.fbox h4{font-family:var(--serif)}
.bnd{background:rgba(176,58,32,.04);border-color:rgba(176,58,32,.14)}
.bnd h4{font-family:var(--serif)}
.bnd p{line-height:1.85}
.sg .si{background:var(--fill);padding:15px 17px}
.stx{line-height:1.9;font-size:14.5px}
.al li{line-height:1.85}
.rt{background:var(--fill);border:1px solid var(--border)}
.tens-sec>h2,.pano>h2{font-family:var(--serif);letter-spacing:.05em}
.tc{border-left-color:var(--seal)}
.tc-t{font-family:var(--serif);letter-spacing:.02em}
.tc-res{line-height:1.9;background:var(--fill)}
.tc-ess{line-height:1.8}
.pc{border:1px solid var(--border)}
.pc h3{font-family:var(--serif);letter-spacing:.02em}
.pl{line-height:1.7}
.disc{line-height:1.9}
.footer{letter-spacing:.12em}
.fbtn{border:1px solid transparent}
.fbtn.on{background:var(--seal)}
.tab{min-height:48px}
.nav-back,.nav-title{letter-spacing:.02em}
.nav-title{font-family:var(--serif)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="nav"><div class="nav-inner">
<a class="nav-back" href="index.html"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 2L2 10l8 8"/></svg>书库</a>
<div class="nav-title">全部卡片</div>
</div>
<div class="container">

<!-- Search -->
<div class="search-section">
  <div class="search-label">🔍 关键词搜索</div>
  <div class="search-row">
    <input class="search-input" id="searchInput" type="text" placeholder="输入关键词搜索（如：谈判、竞争、创新）...">
    <button class="search-btn" onclick="doSearch()">搜索</button>
  </div>
  <div class="search-label" style="margin-top:4px" id="solve">💡 问题求解</div>
  <div class="question-row">
    <textarea class="question-input" id="questionInput" placeholder="描述你的问题（如：如何谈薪资？团队冲突怎么办？）"></textarea>
    <div class="q-btns">
      <button class="question-btn" onclick="doMatch()">匹配</button>
      <button class="question-btn deep-btn" onclick="deepSolve()">🧠 深度求解</button>
    </div>
  </div>
  <div class="search-hint">匹配=离线速查模板方案 · 深度求解=生成带命中卡片的提示词，复制到 QoderWork 对话里跑五段式深度方案</div>
  <div class="deep-box" id="deepBox" style="display:none">
    <div class="deep-box-head">🧠 深度求解提示词（已带上你命中的卡片）<button class="copy-btn" id="copyBtn" onclick="copyDeep()">复制</button></div>
    <textarea class="deep-prompt" id="deepPrompt" readonly></textarea>
    <div class="deep-tip">用法：点「复制」→ 打开 QoderWork 对话框粘贴发送 → 用 knowledge-problem-solver 深度版跑「⓪澄清 ①根因 ②方法论讲透 ③具体行动 ④对抗检验」五段方案。</div>
  </div>
</div>

<div class="result-count" id="resultCount"></div>

<div class="match-section" id="matchSection">
  <div class="match-header">🎯 匹配结果 <span class="match-count" id="matchCount"></span></div>
  <div class="match-grid" id="matchGrid"></div>

function renderCard(c,score){
  const sc=score!==undefined?`<span class="ci-score">${score}</span>`:'';
  const tags=c.tg.slice(0,3).map(t=>`<span class="tag tag-b">${t}</span>`).join('');
  return `<a class="ci" data-book="${c.bk}" data-id="${c.id}" href="${c.f}" target="_blank" rel="noopener">
    <div class="ci-head"><span class="ci-num">${c.n}</span><span class="ci-title">${c.t}</span>${sc}</div>
    <div class="ci-book">${c.bn}</div>
    <div class="ci-concept">${c.c}</div>
    <div class="ci-tags">${tags}</div>
  </a>`;
}

      <div class="topic-header"><div class="topic-dot" style="background:${v.color}"></div><h2>${v.icon} ${v.name}</h2><span class="tc">${tc.length} 张</span></div>
      <div class="cards-grid">${tc.map(c=>renderCard(c)).join('')}</div>
    </div>`;
  }
  el.innerHTML=h;
}

let curTopic='all';
function filterTopic(t){
  curTopic=t;
  document.querySelectorAll('.topic-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.topic-btn[data-topic="${t}"]`).classList.add('active');
  document.querySelectorAll('.topic-section').forEach(s=>{
    s.style.display=(t==='all'||s.dataset.topic===t)?'':'none';
  });
  document.getElementById('matchSection').classList.remove('show');
  document.getElementById('resultCount').classList.remove('show');
  document.getElementById('searchInput').value='';
  document.querySelectorAll('.ci').forEach(c=>c.classList.remove('hidden'));
}

function doSearch(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q){
    document.querySelectorAll('.ci').forEach(c=>c.classList.remove('hidden'));
    document.getElementById('resultCount').classList.remove('show');
    document.getElementById('matchSection').classList.remove('show');
    return;
  }
  const terms=q.split(/\s+/).filter(Boolean);
  let count=0;
  document.querySelectorAll('.ci').forEach(el=>{
    const card=cards.find(c=>c.id===el.dataset.id);
    if(!card)return;
    const hay=(card.t+' '+card.c+' '+card.tg.join(' ')+' '+card.kw+' '+card.bn).toLowerCase();
    const match=terms.some(t=>hay.includes(t));
    if(match){el.classList.remove('hidden');count++}else{el.classList.add('hidden')}
  });
  const rc=document.getElementById('resultCount');
  rc.textContent=`搜索"${q}"找到 ${count} 张卡片`;
  rc.classList.add('show');
  document.getElementById('matchSection').classList.remove('show');
  document.querySelectorAll('.topic-section').forEach(s=>s.style.display='');
  curTopic='all';
  document.querySelectorAll('.topic-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.topic-btn[data-topic="all"]').classList.add('active');
}

function renderSolution(sol){
  const m=sol.methods.map(x=>`<div class="sol-method"><div class="m-name">${x.n}</div><div class="m-desc">${x.w}<br><span class="m-book">📚 ${x.b} · <a href="${x.l}" target="_blank" rel="noopener">查看卡片</a></span></div></div>`).join('');
  const s=sol.steps.map((x,i)=>`<div class="sol-step"><div class="s-n">${i+1}</div><div class="s-t">${x.a}<span class="s-src">— ${x.s}</span></div></div>`).join('');
  const r=sol.risks.map(x=>`<div class="sol-risk">${x}</div>`).join('');
  return `<div class="sol-box">
    <div class="sol-header">🎯 解决方案：${sol.title}</div>
    <div class="sol-sec sol-diag"><h3><span class="num">①</span>问题诊断</h3><p>${sol.diagnosis}</p></div>
    <div class="sol-sec sol-methods"><h3><span class="num">②</span>适用方法论</h3>${m}</div>
    <div class="sol-sec sol-steps"><h3><span class="num">③</span>行动步骤</h3>${s}</div>
    <div class="sol-sec sol-risks"><h3><span class="num">④</span>风险提示</h3>${r}</div>
  </div>`;
}

function doMatch(){
  const q=document.getElementById('questionInput').value.trim();
  if(!q)return;
  // 保存问题到URL hash，页面重载后可从hash恢复方案
  try{history.replaceState(null,'','#q='+encodeURIComponent(q))}catch(e){}
  const ql=q.toLowerCase();
  const ms=document.getElementById('matchSection');
  const mc=document.getElementById('matchCount');
  const mg=document.getElementById('matchGrid');

  // 优先匹配四段式解决方案模板
  let bestSol=null,bestScore=0;
  SOLUTIONS.forEach(sol=>{
    let score=0;
    sol.kw.forEach(k=>{if(ql.includes(k))score+=3});
    [...ql].filter(ch=>/[\u4e00-\u9fff]/.test(ch)).forEach(ch=>{sol.kw.forEach(k=>{if(k.includes(ch))score+=0.5})});
    if(score>bestScore){bestScore=score;bestSol=sol}
  });

  if(bestSol && bestScore>=2){
    ms.classList.add('show');
    mc.textContent='';
    mg.innerHTML=renderSolution(bestSol)+`<div class="sol-fallback-tip">💡 需要更定制化的方案？在QoderWork中对我说"用知识库帮我解决：<b>${q}</b>"，我会做深度推理。</div>`;
    ms.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }

  // 回退：卡片列表匹配
  const scored=[];
  cards.forEach(card=>{
    let score=0;
    for(const[pat,ids]of Object.entries(qMap)){
      if(new RegExp(pat,'i').test(ql)){
        if(ids.includes(card.id))score+=10;
      }
    }
    const hay=(card.t+' '+card.c+' '+card.tg.join(' ')+' '+card.kw+' '+card.bn).toLowerCase();
    const terms=ql.split(/[\s\uff0c\u3002\uff1f\uff01\u3001,.\?!]+/).filter(t=>t.length>=2);
    terms.forEach(t=>{if(hay.includes(t))score+=3});
    [...ql].filter(ch=>/[\u4e00-\u9fff]/.test(ch)).forEach(ch=>{if(hay.includes(ch))score+=1});
    if(score>0)scored.push({card,score});
  });
  scored.sort((a,b)=>b.score-a.score);
  const top=scored.slice(0,12);
  if(!top.length){
    ms.classList.add('show');mc.textContent='- 未找到匹配，试试换个描述';mg.innerHTML='';return;
  }
  ms.classList.add('show');
  mc.textContent=`- ${top.length} 张相关卡片`;
  mg.innerHTML=top.map(({card,score})=>renderCard(card,score)).join('');
  ms.scrollIntoView({behavior:'smooth',block:'start'});
}

function deepSolve(){
  const q=document.getElementById('questionInput').value.trim();
  if(!q){document.getElementById('questionInput').focus();return;}
  try{history.replaceState(null,'','#q='+encodeURIComponent(q))}catch(e){}
  const ql=q.toLowerCase();
  // 与 doMatch 回退路径同款打分，取 top 8 卡片
  const scored=[];
  cards.forEach(card=>{
    let score=0;
    for(const[pat,ids]of Object.entries(qMap)){
      if(new RegExp(pat,'i').test(ql)){if(ids.includes(card.id))score+=10;}
    }
    const hay=(card.t+' '+card.c+' '+card.tg.join(' ')+' '+card.kw+' '+card.bn).toLowerCase();
    const terms=ql.split(/[\s，。？！、,.\?!]+/).filter(t=>t.length>=2);
    terms.forEach(t=>{if(hay.includes(t))score+=3});
    [...ql].filter(ch=>/[\u4e00-\u9fff]/.test(ch)).forEach(ch=>{if(hay.includes(ch))score+=1});
    if(score>0)scored.push({card,score});
  });
  scored.sort((a,b)=>b.score-a.score);
  const top=scored.slice(0,8);
  const cardList=top.length
    ? top.map(({card},i)=>`${i+1}. ${card.bn}·${card.t} — ${card.c}`).join('\n')
    : '（未命中特定卡片，请从全部212张中自行选取最相关的2-4张）';
  const prompt=
`请用「知识库问题求解器（深度版）」帮我分析下面这个问题，严格按五段式输出，反套话、落到我的具体处境。

【我的问题】
${q}

【我的知识库中命中的方法论卡片（优先从中选2-4张，也可补充）】
${cardList}

【输出要求（五段式，逐段达标）】
⓪ 问题重述与澄清：一句话复述你理解的问题本质让我确认；若信息不足以做出"落到我处境"的推理，先反问我1-3个最关键的问题再作答；补的假设标【假设】，缺口标【待确认】。
① 根因诊断：用5 Whys把症状挖到至少第3层根因；区分真问题vs伪问题；抓主要矛盾；判断这是连续环境(可用经验/归纳)还是非连续拐点(须从第一性演绎)；给出可检验的"什么算解决了"。
② 适用方法论：选2-4张卡片，每张讲透三层——机制(为什么会成立)、映射(为什么恰好对得上我的具体情况，接到我的事实上)、边界(在我这场景哪里会失效)；说明卡片之间的张力与调和；并解释"为什么是这几张、不是别的"。
③ 具体行动步骤：3-6步，每步写"做什么→怎么做(具体到动作/话术/数字)→用哪张卡→判断这步做对了的信号→这步失败怎么办"；标注先后依赖和关键决策点；给出今天就能做的最小第一步。
④ 对抗性检验：这套方案依赖哪些前提、哪个不成立就崩；最可能栽在哪一步、为什么；出现什么可观察的早期预警信号该停/该调；谁会因为这套动作反制、我忽略了哪些利益相关者；反过来做会怎样、最坏情况的PlanB/止损线。诚实说明把握多大、哪里没底，不保证一定有效。

硬性自检：任何一句话如果换到别的问题上也成立，就是空话，删掉重写。`;
  document.getElementById('deepPrompt').value=prompt;
  const box=document.getElementById('deepBox');
  box.style.display='block';
  box.scrollIntoView({behavior:'smooth',block:'start'});
}

function copyDeep(){
  const ta=document.getElementById('deepPrompt');
  const btn=document.getElementById('copyBtn');
  ta.select();ta.setSelectionRange(0,99999);
  let ok=false;
  try{ok=document.execCommand('copy')}catch(e){}
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(()=>flash(btn)).catch(()=>flash(btn));return;}
  flash(btn);
}
function flash(btn){const o=btn.textContent;btn.textContent='已复制✓';setTimeout(()=>btn.textContent=o,1500);}

document.addEventListener('DOMContentLoaded',()=>{
  renderAll();
  document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
  document.getElementById('questionInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doMatch()}});
  // 从URL hash恢复之前的问题和方案（返回书库/刷新页面后方案不丢）
  const hm=location.hash.match(/#q=(.+)/);
  if(hm){
    try{
      const savedQ=decodeURIComponent(hm[1]);
      document.getElementById('questionInput').value=savedQ;
      doMatch();
    }catch(e){}
  }
});
